worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 500m;

    upstream manager_app {
        server farm-manager:5000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Served over plain http so certbot renewals can complete.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/__CWM_DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__CWM_DOMAIN__/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Each emulator's noVNC, reached by container name over farm-network.
        # The panel must not iframe http://ip:port directly - browsers block
        # that as mixed content once the panel itself is served over TLS.
        # 127.0.0.11 is docker's embedded DNS; the resolver is required because
        # proxy_pass uses a variable, which defers name lookup to request time.
        location ~ ^/vnc/([A-Za-z0-9_-]+)/?(.*)$ {
            resolver 127.0.0.11 valid=10s;
            set $emu  $1;
            set $rest $2;

            proxy_pass http://android-$emu:6080/$rest$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # VNC sessions idle for long stretches between interactions.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://manager_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
