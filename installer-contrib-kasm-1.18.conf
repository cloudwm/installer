#
# Kasm Workspaces installer config.
# Downloads and installs Kasm via apps/kasm-all_version (which installs Docker,
# swap and dependencies itself). The version is passed to the script via the
# KASM_VERSION env var below.
#
. installer-contrib-tweaks-preinstall.conf

execute+=(include/installInProgressSSH)
execute+=(tweaks/ubuntu-ufw-enable)
execute+=(tweaks/ubuntu-ufw-allowhttp)   # opens 80 + 443 for the Kasm web UI
execute+=(tweaks/ubuntu-reject-ipv6-no-route)   # fast-fail outbound IPv6 so apt/docker fall back to IPv4 instead of hanging
execute+=(tweaks/ubuntu-updateos)

. installer-contrib-tweaks-optimize.conf

# Kasm version. apps/kasm-all-version reads ${KASM_VERSION:-1.19.0}; this export
# is inherited by the script when the installer runs it as a child process.
#
# 1.18.1 publishes a BARE tarball: kasm_release_1.18.1.tar.gz (HTTP 200 — verified),
# so no KASM_BUILD hash is needed. (Note: bare 1.18.0 is HTTP 403 — use 1.18.1.)
export KASM_VERSION="1.18.1"
execute+=(tweaks/nginx-letsencrypt-cert)        # obtain the SSL cert in the .conf, like the other apps
execute+=(apps/kasm-all-version)                # installs Kasm and applies the LE cert from the tweak above

execute+=(tweaks/motd-description-append)
execute+=(tweaks/cwm-description-autoconfig)

execute+=(include/installInProgressSSH-remove)
