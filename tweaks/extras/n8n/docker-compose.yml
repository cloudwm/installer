version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=__CWM_DOMAIN__
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://__CWM_DOMAIN__/
      - N8N_RUNNERS_ENABLED=true
      - GENERIC_TIMEZONE=Etc/UTC
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

volumes:
  n8n_data:
