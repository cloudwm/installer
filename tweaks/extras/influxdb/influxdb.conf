server {
    listen 80;
    listen [::]:80;
    server_name CWMDOMAIN;

    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2", not the newer "http2 on;": ppa:nginx/stable publishes
    # nothing past zesty, so on 24.04 nginx comes from the Ubuntu archive at
    # 1.24, where "http2 on;" is an unknown directive and nginx -t fails.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CWMDOMAIN;

    # Populated by tweaks/nginx-enable-ssl-letsencrypt and kept in step with
    # renewals, so the paths are not repeated here.
    include snippets/letsencrypt-nginx-certs.conf;

    # Line-protocol writes arrive as one body and routinely exceed the 1m default.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8086;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Flux returns results as a stream: buffering would withhold them until
        # the query completed, and the 60s default read timeout would cut long
        # queries off mid-answer.
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
