#
# This is the config file where we define what will be executed in the installer script.
#
# installer will read variables and will execute them one by one.
#
. installer-contrib-tweaks-preinstall.conf

execute+=(include/installInProgressSSH)
execute+=(tweaks/ubuntu-ufw-enable)
execute+=(tweaks/ubuntu-ufw-allowhttp)
execute+=(tweaks/ubuntu-updateos)

. installer-contrib-tweaks-optimize.conf

execute+=(services/nginx-latest-offirepo)
execute+=(include/installInProgressHttpd)

# Inline php-fpm 8.1 installer (replaces services/phpfpm-8.1-osrepo, which
# silently fails on Ubuntu 24.04 when launchpad.net's API is unreachable —
# `add-apt-repository ppa:ondrej/php` hangs, the `| log` pipe swallows the
# error, and apt then can't find php8.1-fpm in noble's stock repos).
# Defined as a function so it slots into the execute=() array at the correct
# point in the sequence (after ubuntu-updateos, after mysqlserver), the same
# slot the old services/phpfpm-8.1-osrepo occupied.
installPhpFpm81() {
    echo "Inline php-fpm 8.1 install: adding ondrej/php PPA mechanically" | log
    install -d -m 0755 /etc/apt/keyrings
    if [ ! -s /etc/apt/keyrings/ondrej-php.gpg ]; then
        timeout 30 gpg --batch --no-default-keyring \
            --keyring /etc/apt/keyrings/ondrej-php.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys 14AA40EC0831756756D7F66C4F4EA0AAE5267A6C 2>&1 | log
        waitOrStop 0 "Failed to fetch ondrej/php signing key from keyserver.ubuntu.com"
        chmod 0644 /etc/apt/keyrings/ondrej-php.gpg
    fi
    if [ ! -f /etc/apt/sources.list.d/ondrej-php.sources ]; then
        cat > /etc/apt/sources.list.d/ondrej-php.sources <<EOF
Types: deb
URIs: https://ppa.launchpadcontent.net/ondrej/php/ubuntu/
Suites: $(lsb_release -cs)
Components: main
Signed-By: /etc/apt/keyrings/ondrej-php.gpg
EOF
        apt-get update 2>&1 | log
        waitOrStop 0 "apt-get update failed after adding ondrej/php PPA"
    fi

    echo "Installing php8.1-fpm" | log
    installPackage php8.1-fpm
    waitOrStop 0 "Failed apt install: php8.1-fpm"

    echo "Installing php8.1 modules" | log
    local php81_packages=(php8.1-cli php8.1-bz2 php8.1-common php8.1-curl php8.1-gd php8.1-json php8.1-mbstring php8.1-mysql php8.1-readline php8.1-xml php8.1-zip php8.1-bcmath php8.1-intl php8.1-soap)
    installPackage "${php81_packages[@]}"
    waitOrStop 0 "Failed apt install: ${php81_packages[*]}"

    echo "Configuring php-fpm to listen on 127.0.0.1:9000" | log
    sed -i 's/listen = \/run\/php\/php8.1-fpm.sock/listen = 127.0.0.1:9000/g' /etc/php/8.1/fpm/pool.d/www.conf

    echo "Restarting php8.1-fpm" | log
    service php8.1-fpm restart
    waitOrStop 0 "Restart php8.1-fpm service failed"

    descriptionAppend "PHP config files location: /etc/php/"
    descriptionAppend "PHP-FPM config files location: /etc/php/8.1/fpm/"
    descriptionAppend " "

    tag php.success
    tag php-fpm.success

    return 0
}

execute+=(services/mysqlserver-8.0-osrepo)
execute+=(installPhpFpm81)
execute+=(services/php-fpm-module)
execute+=(tweaks/php-fpm-autoconfig)
execute+=(tweaks/php-fpm-tweaks)

execute+=(services/sendmail-latest-osrepo)

execute+=(services/certbot-latest-offirepo-nginx)
execute+=(tweaks/nginx-enable-ssl-letsencrypt)
execute+=(tweaks/nginx-enable-php)
execute+=(tweaks/nginx-enable-php-ssl)

execute+=(apps/magento-2.4.6-offirepo-nginx-mysqlserver)

execute+=(tweaks/mysql-server-autoconfig)

execute+=(tweaks/motd-header-tweak)
execute+=(tweaks/motd-description-append)
execute+=(tweaks/cwm-description-autoconfig)

execute+=(include/installInProgressHttpd-remove)
execute+=(include/installInProgressSSH-remove)
